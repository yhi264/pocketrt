name: CI

# 公開ソースが単体でビルドでき、テストが通ることを機械的に検証する。
# 論文の再現性の主張（このリポジトリを clone すれば同じ結果が得られる）を支える。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # .xcodeproj はリポジトリに含めない方針。project.yml から生成する。
      # clone した人と同じ手順を CI でも踏む。
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # シミュレータ名はランナーの Xcode バージョンで変わるため、
      # ハードコードせず利用可能な iPhone を実行時に選ぶ。
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
                 | grep -oE '^ +iPhone [^(]+' \
                 | sed 's/^ *//; s/ *$//' \
                 | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::利用可能な iPhone シミュレータが見つかりません"
            xcrun simctl list devices available
            exit 1
          fi
          echo "選択: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # シミュレータ向けビルドのため署名は不要。
      # 公開版は DEVELOPMENT_TEAM が空なので明示的に署名を切る。
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PocketRT.xcodeproj \
            -scheme PocketRT \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xcodebuild.log

      # xcodebuild はパイプ経由だと終了コードが後段のものになる。
      # 出力の文字列で最終判定する。
      - name: Verify test result
        if: always()
        run: |
          if [ ! -f /tmp/xcodebuild.log ]; then
            echo "::error::ビルドログがありません（前段で失敗しています）"
            exit 1
          fi
          if ! grep -q "TEST SUCCEEDED" /tmp/xcodebuild.log; then
            echo "::error::TEST SUCCEEDED が出力に見つかりません"
            exit 1
          fi
          grep -oE "Test run with [0-9]+ tests in [0-9]+ suites (passed|failed)" /tmp/xcodebuild.log | tail -1

      # カタログがコードより古いままコミットされることを防ぐ。
      # xcodebuild は .stringsdata を生成するだけでカタログを更新しないため、
      # 同期は tools/sync-strings.sh が担う。
      #
      # 厳密な差分ではなく包含で見る。抽出されるキーの集合は Xcode の
      # バージョンでわずかに異なり（実測: 26.3 は "%@ (%lld)" を出すが 16.4 は出さない）、
      # 完全一致を要求するとランナーの更新だけで落ちる。捕まえたいのは
      # 「抽出されたのにカタログに無い」＝翻訳不能な文字列がある状態の方である。
      - name: Verify String Catalog is in sync
        run: |
          set -euo pipefail
          cp PocketRT/Localizable.xcstrings /tmp/catalog-committed.json
          ./tools/sync-strings.sh
          python3 - <<'PYEOF'
          import json, sys
          committed = set(json.load(open('/tmp/catalog-committed.json'))['strings'])
          extracted = set(json.load(open('PocketRT/Localizable.xcstrings'))['strings'])
          missing = sorted(extracted - committed)
          if missing:
              print(f"::error::String Catalog に載っていない文字列が {len(missing)} 件あります。app/ で ./tools/sync-strings.sh を実行してコミットしてください")
              for k in missing[:20]:
                  print(f"  {k[:80]}")
              sys.exit(1)
          extra = sorted(committed - extracted)
          if extra:
              print(f"::notice::このランナーの Xcode では抽出されないキーが {len(extra)} 件あります（新しい Xcode 由来か、既に使われていない文字列）")
              for k in extra[:20]:
                  print(f"  {k[:80]}")
          print(f"String Catalog は同期されています（抽出 {len(extracted)} 件 / コミット済み {len(committed)} 件）")
          PYEOF

      # 版番号が 3 か所で食い違ったまま公開されることを防ぐ。
      #
      # 2026-09-06 に、公開リポジトリが 0.10.0 (build 3) のまま 3 週間放置され、
      # App Store で公開中の 1.0.0 が載っていない状態が見つかった。直近の
      # commit は紹介ページ（docs/）ばかりで、リポジトリが動いているように
      # 見えていたことが発覚を遅らせた。
      #
      # ここから非公開リポジトリは見えないので「本当に最新か」は判定できない。
      # 判定できるのは、公開されている 3 つ（project.yml・生成された
      # project.pbxproj・CHANGELOG.md）が互いに整合しているかまでである。
      # 雑な同期はこれで落ちる。
      - name: Verify version numbers agree
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, sys
          spec = open("project.yml", encoding="utf-8").read()
          version = re.search(r'^\s*MARKETING_VERSION:\s*"([^"]+)"', spec, re.M).group(1)
          build = re.search(r'^\s*CURRENT_PROJECT_VERSION:\s*"([^"]+)"', spec, re.M).group(1)

          pbx = open("PocketRT.xcodeproj/project.pbxproj", encoding="utf-8").read()
          if set(re.findall(r"MARKETING_VERSION = ([^;]+);", pbx)) != {version} \
             or set(re.findall(r"CURRENT_PROJECT_VERSION = ([^;]+);", pbx)) != {build}:
              print("::error::project.pbxproj が project.yml と食い違っています")
              sys.exit(1)

          log = open("CHANGELOG.md", encoding="utf-8").read()
          heads = re.findall(r"^## (.+)$", log, re.M)
          top = heads[0] if heads else ""
          if top == "未リリース":
              body = log.split("## 未リリース", 1)[1].split("\n## ", 1)[0]
              m = re.search(r"バージョンは (\d+\.\d+\.\d+)（build (\d+)）を予定している。", body)
              declared = (m.group(1), m.group(2)) if m else None
          else:
              m = re.match(r"^(\d+\.\d+\.\d+) — .*（build (\d+)）\s*$", top)
              declared = (m.group(1), m.group(2)) if m else None
          if declared is None:
              print(f"::error::CHANGELOG の先頭 {top!r} から版番号を読めません")
              sys.exit(1)
          if declared != (version, build):
              print(f"::error::CHANGELOG は {declared[0]} (build {declared[1]}) ですが "
                    f"project.yml は {version} (build {build}) です")
              sys.exit(1)
          print(f"版番号は整合しています: {version} (build {build})")
          PYEOF

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
