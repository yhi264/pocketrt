name: PocketRT
options:
  bundleIdPrefix: jp.yoshiki
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  knownRegions: [ja, en, Base]
settings:
  base:
    SWIFT_VERSION: "6.0"
    # String Catalog への抽出には .stringsdata の生成が要る。
    # 既定は NO で、無効のままだと Text("リテラル") すらカタログに入らない。
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PocketRT:
    type: application
    platform: iOS
    sources:
      - PocketRT
    info:
      path: PocketRT/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PocketRT
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yoshiki.PocketRT
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone 専用（1 = iPhone, 2 = iPad）。
        # 指定しないと iPhone + iPad の両対応になり、iPad マルチタスキングの要件として
        # 4 方向すべての画面向きが必須となる。本アプリは縦向き固定で設計されており、
        # iPad レイアウトも未検証のため iPhone 専用とする。
        # iPhone 専用アプリは iPad でも互換モードでインストール・実行できる。
        TARGETED_DEVICE_FAMILY: "1"
  PocketRTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketRTTests
    dependencies:
      - target: PocketRT
    settings:
      base:
        # これがないと xcodebuild test が
        # "Cannot code sign because the target does not have an Info.plist file" で
        # ビルドに失敗する。アプリ本体は明示的な Info.plist を使うが
        # （GENERATE_INFOPLIST_FILE: NO）、テストバンドルは自動生成でよい。
        GENERATE_INFOPLIST_FILE: YES
