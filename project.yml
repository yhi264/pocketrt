name: PocketRT
options:
  bundleIdPrefix: jp.yoshiki
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  knownRegions: [ja, en, Base]
settings:
  base:
    SWIFT_VERSION: "6.0"
    # String Catalog への抽出には .stringsdata の生成が要る。
    # 既定は NO で、無効のままだと Text("リテラル") すらカタログに入らない。
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "11"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PocketRT:
    type: application
    platform: iOS
    sources:
      - PocketRT
    info:
      path: PocketRT/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PocketRT
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yoshiki.PocketRT
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone 専用（1 = iPhone, 2 = iPad）。
        # 指定しないと iPhone + iPad の両対応になり、iPad マルチタスキングの要件として
        # 4 方向すべての画面向きが必須となる。本アプリは縦向き固定で設計されており、
        # iPad レイアウトも未検証のため iPhone 専用とする。
        # iPhone 専用アプリは iPad でも互換モードでインストール・実行できる。
        TARGETED_DEVICE_FAMILY: "1"
  PocketRTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PocketRTTests
    dependencies:
      - target: PocketRT
    settings:
      base:
        # これがないと xcodebuild test が
        # "Cannot code sign because the target does not have an Info.plist file" で
        # ビルドに失敗する。アプリ本体は明示的な Info.plist を使うが
        # （GENERATE_INFOPLIST_FILE: NO）、テストバンドルは自動生成でよい。
        GENERATE_INFOPLIST_FILE: YES
  PocketRTUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PocketRTUITests
    dependencies:
      - target: PocketRT
    settings:
      base:
        # 単体テストと同じ理由（Info.plist が無いと署名で落ちる）。
        GENERATE_INFOPLIST_FILE: YES
    # App Store 提出用スクリーンショットの撮影に使う。通常の
    # `xcodebuild test` には含めない（起動と画面遷移で時間がかかり、
    # CI の単体テストを遅くするため）。撮影は tools/screenshots.sh から
    # -only-testing で明示的に呼ぶ。
schemes:
  # CI と日常の `xcodebuild test` はこちら。単体テストだけを走らせる。
  PocketRT:
    build:
      targets:
        PocketRT: all
        PocketRTTests: [test]
    test:
      targets:
        - PocketRTTests
      # **テストの言語を日本語に固定する。**
      #
      # 検査の多くが画面に出る日本語の文言そのものを見ている（「末梢」を
      # 含むか、「誤植」と書いてあるか等）。`String(localized:)` は実行環境の
      # 言語で解決されるため、英語環境で走らせると英語が返って落ちる。
      #
      # 2026-09-06、公開リポジトリの CI（GitHub の macOS ランナーは en_US）で
      # 44 件が落ちて発覚した。開発機が日本語ロケールだったため、ローカルでは
      # 一度も再現しなかった。英語対応を入れるまでは日本語しか無く、
      # 実行環境の言語に依存していること自体が表に出なかった。
      #
      # 英語の表示は `EnglishLocalizationTests` が locale を明示して検証する。
      # そちらはこの固定の影響を受けない。
      language: ja
      region: JP
    run:
      config: Debug
  # App Store 提出用スクリーンショットの撮影専用。
  # 上のスキームに混ぜると、起動と画面遷移で CI が遅くなる。
  # tools/screenshots.sh がこちらを使う。
  PocketRT-Screenshots:
    build:
      targets:
        PocketRT: all
        PocketRTUITests: [test]
    test:
      targets:
        - PocketRTUITests
